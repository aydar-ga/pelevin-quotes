# CI for pelevin-quotes (Next.js + Neon + Better Auth).
#
# Jobs:
#   0. lint-workflows — actionlint on .github/workflows
#   1. test  — lint, types, Vitest, npm audit (high+), Playwright E2E against a
#              production build (`next build && next start`)
#   2. build — production `next build` (only after all tests pass)
#
# E2E uses an ephemeral Postgres 16 service container (no Neon secret required).
# Third-party actions are pinned to commit SHAs; Dependabot bumps them.

name: Pelevin-Quotes CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/*"
      - "fix/*"
      - "release/*"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout — clone the repository at the triggering ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: actionlint — static checks for GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  test:
    name: Lint, types, unit & API E2E tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pelevin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pelevin_ci?sslmode=disable
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-e2e-32-byte-secret-pad-pad-pad-pad' }}
      RESEND_API_KEY: ""

    steps:
      - name: Checkout — clone the repository at the triggering ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Node.js (.nvmrc) — install runtime and cache npm dependencies
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dependencies — clean install from package-lock.json (npm ci)
        run: npm ci

      - name: ESLint — static analysis for bugs and style violations
        run: npm run lint

      - name: TypeScript — compile check without emitting files (tsc --noEmit)
        run: npm run type-check

      - name: Vitest — unit & component tests in tests/
        run: npm test

      # The 4 accepted moderate drizzle-kit findings (dev-only, accepted)
      # stay below this bar; any high or critical advisory fails CI.
      - name: npm audit — fail on high or critical advisories
        run: npm audit --audit-level=high

      - name: Database — push schema for API E2E
        run: npm run db:push -- --force

      - name: Database — seed quotes for API E2E
        run: npm run db:seed

      - name: Playwright — download Chromium and OS dependencies for headless runs
        run: npx playwright install --with-deps chromium

      - name: Playwright — E2E against a production build (next build && next start)
        run: npm run test:e2e
        env:
          CI: "true"
          DEV_TEST_AUTH: "true"
          DEV_TEST_USER_EMAIL: dev@test.local

  build:
    name: Production build
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout — clone the repository at the triggering ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Node.js (.nvmrc) — install runtime and cache npm dependencies
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dependencies — clean install from package-lock.json (npm ci)
        run: npm ci

      - name: Next.js build — verify the app compiles for production
        run: npm run build
        env:
          # Placeholder is enough; build does not query the database.
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgres://user:pass@localhost:5432/db?sslmode=require' }}
